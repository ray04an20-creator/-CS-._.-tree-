<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> شجرة قسم علوم الحاسوب - جامعة الرفاق </title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding: 20px; min-height: 100vh; }
        
        .welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }

        .welcome-modal {
            background: var(--card-bg); border-radius: 20px; padding: 30px;
            max-width: 480px; width: 100%; text-align: center; border: 1px solid var(--border);
        }

        .welcome-modal h2 { color: var(--primary); margin-bottom: 10px; font-weight: 800; }
        .welcome-modal p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }

        .modal-buttons { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn {
            background: #f1f5f9; border: 2px solid var(--border); padding: 12px;
            border-radius: 12px; cursor: pointer; font-weight: 700; color: var(--text-dark);
            transition: all 0.2s;
        }
        .modal-btn:hover { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

        .container { max-width: 1300px; margin: 0 auto; }

        header {
            text-align: center; margin-bottom: 20px; padding: 20px;
            background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border);
        }

        header h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 8px; font-weight: 800; }

        .type-selector { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .type-btn {
            background: #f1f5f9; border: 2px solid var(--border); padding: 6px 16px;
            border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.85rem;
        }
        .type-btn.active { background: #eff6ff; border-color: var(--primary); color: var(--primary); }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg); padding: 12px; border-radius: 12px;
            text-align: center; border: 1px solid var(--border);
        }
        .stat-card h3 { font-size: 0.8rem; color: var(--text-muted); }
        .stat-card .value { font-size: 1.4rem; font-weight: 800; color: var(--primary); }

        .main-layout { display: grid; grid-template-columns: 2.3fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

        .category-title {
            font-size: 1.05rem; color: var(--primary); margin: 20px 0 10px 0;
            border-bottom: 2px solid var(--border); padding-bottom: 4px; font-weight: 800;
        }

        .courses-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 10px; margin-bottom: 10px;
        }

        .course-card {
            background: var(--card-bg); border: 2px solid var(--border); padding: 10px;
            border-radius: 10px; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .course-card:hover { transform: translateY(-2px); }
        .course-card.passed { background-color: #ecfdf5; border-color: var(--success); }
        .course-card.locked { opacity: 0.5; background: #f1f5f9; cursor: not-allowed; transform: none !important; }

        .units-dots { display: flex; gap: 3px; margin-bottom: 6px; }
        .dot { width: 12px; height: 12px; border: 1.5px solid var(--primary); background: #fff; border-radius: 2px; }
        .course-card.passed .dot { background: var(--success); border-color: var(--success); }

        .course-card .title { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
        .course-card .prereq { font-size: 0.72rem; color: #ef4444; font-weight: 600; line-height: 1.2; }

        .status-badge {
            position: absolute; top: 8px; left: 8px; font-size: 0.6rem;
            padding: 2px 5px; border-radius: 10px; background: var(--border); font-weight: bold;
        }
        .course-card.passed .status-badge { background: var(--success); color: white; }

        .next-panel {
            background: var(--card-bg); padding: 18px; border-radius: 16px;
            border: 1px solid var(--border); height: fit-content; position: sticky; top: 20px;
        }

        .next-item {
            padding: 8px; background: #f8fafc; border-right: 3px solid var(--primary-light);
            margin-bottom: 6px; border-radius: 4px; font-size: 0.85rem; font-weight: 600;
            display: flex; justify-content: space-between;
        }

        footer {
            margin-top: 30px; padding: 15px; text-align: center;
            font-size: 0.9rem; font-weight: 700; color: var(--text-muted); border-top: 1px solid var(--border);
        }
        footer span { color: var(--primary); }
    </style>
</head>
<body>

<div class="welcome-overlay" id="welcome-modal">
    <div class="welcome-modal">
        <h2>شجرة قسم علوم الحاسوب 🎓</h2>
        <p>جامعة الرفاق - حدد نظامك الدراسي للبدء:</p>
        <div class="modal-buttons">
            <button class="modal-btn" onclick="selectInitialType('regular')">📘 طالب منتظم (متطلبات شجرية)</button>
            <button class="modal-btn" onclick="selectInitialType('transfer')">🔄 طالب معادلة (تنزيل حر)</button>
        </div>
    </div>
</div>

<div class="container">
    <header>
        <h1>🎓 شجرة قسم علوم الحاسوب - جامعة الرفاق</h1>
        <div class="type-selector">
            <button id="btn-regular" class="type-btn active" onclick="setStudentType('regular')">طالب منتظم</button>
            <button id="btn-transfer" class="type-btn" onclick="setStudentType('transfer')">طالب معادلة</button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>المواد المصفاة</h3>
            <div class="value" id="passed-count" style="color:var(--success)">0</div>
        </div>
        <div class="stat-card">
            <h3>الوحدات المنجزة</h3>
            <div class="value" id="passed-units">0 / 142</div>
        </div>
        <div class="stat-card">
            <h3>شرط المشروع (115)</h3>
            <div class="value" id="grad-condition" style="color:var(--warning)">0 / 115</div>
        </div>
        <div class="stat-card">
            <h3>نسبة الإنجاز</h3>
            <div class="value" id="progress-percent">0%</div>
        </div>
    </div>

    <div class="main-layout">
        <div>
            <div id="categories-container"></div>
        </div>

        <div class="next-panel">
            <h3 style="color:var(--primary); font-size:1rem; margin-bottom:10px;">🚀 اقتراح الفصل القادم (حتى 21 وحدة)</h3>
            <div id="next-courses-list"></div>
        </div>
    </div>
</div>

<footer>
    Made by <span>Rayan Alhajni</span>
</footer>

<script>
    const TOTAL_UNITS = 142;
    const GRAD_REQ_UNITS = 115;

    const courses = [
        // 1. قسم المواد العامة
        { id: 'ar1', title: 'اللغة العربية', units: 2, cat: '1. المواد العامة', priority: 1, prereqs: [] },
        { id: 'islamic', title: 'ثقافة إسلامية', units: 2, cat: '1. المواد العامة', priority: 1, prereqs: [] },
        { id: 'politics', title: 'مبادئ علوم سياسية', units: 2, cat: '1. المواد العامة', priority: 1, prereqs: [] },
        { id: 'en1', title: 'اللغة الإنجليزية 1', units: 2, cat: '1. المواد العامة', priority: 2, prereqs: [] },
        { id: 'en2', title: 'اللغة الإنجليزية 2', units: 2, cat: '1. المواد العامة', priority: 3, prereqs: ['en1'] },
        { id: 'm1', title: 'رياضة 1', units: 3, cat: '1. المواد العامة', priority: 5, prereqs: [] },
        { id: 'm2', title: 'رياضة 2', units: 3, cat: '1. المواد العامة', priority: 5, prereqs: ['m1'] },
        { id: 'stat', title: 'إحصاء واحتمالات', units: 4, cat: '1. المواد العامة', priority: 3, prereqs: ['m2'] },
        { id: 'logic', title: 'جبر خطي ومنطق', units: 3, cat: '1. المواد العامة', priority: 3, prereqs: ['m2'] },

        // 2.أ المسار البرمجي
        { id: 'prog_base', title: 'أساسيات برمجية', units: 4, cat: '2.أ المسار البرمجي', priority: 10, prereqs: [] },
        { id: 'c_lang', title: 'لغة السي', units: 4, cat: '2.أ المسار البرمجي', priority: 10, prereqs: ['prog_base'] },
        
        { id: 'oop', title: 'البرمجة الشيئية', units: 4, cat: '2.أ المسار البرمجي', priority: 8, prereqs: ['c_lang'] },
        { id: 'java', title: 'لغة الجافا', units: 4, cat: '2.أ المسار البرمجي', priority: 8, prereqs: ['oop'] },

        { id: 'ds1', title: 'تراكيب بيانات 1', units: 4, cat: '2.أ المسار البرمجي', priority: 9, prereqs: ['c_lang'] },
        { id: 'ds2', title: 'تراكيب بيانات 2', units: 4, cat: '2.أ المسار البرمجي', priority: 8, prereqs: ['ds1'] },
        { id: 'ai', title: 'الذكاء الاصطناعي', units: 4, cat: '2.أ المسار البرمجي', priority: 7, prereqs: ['ds2'] },
        { id: 'img', title: 'معالجة الصور (اختياري)', units: 4, cat: '2.أ المسار البرمجي', priority: 4, prereqs: ['ai'], isOptional: true },

        { id: 'v1', title: 'البرمجة المرئية 1', units: 4, cat: '2.أ المسار البرمجي', priority: 7, prereqs: ['c_lang'] },
        { id: 'v2', title: 'البرمجة المرئية 2', units: 4, cat: '2.أ المسار البرمجي', priority: 6, prereqs: ['v1'] },
        { id: 'sim', title: 'النمذجة والمحاكاة', units: 4, cat: '2.أ المسار البرمجي', priority: 5, prereqs: ['v2'] },
        { id: 'gfx', title: 'الرسم بالحاسوب', units: 4, cat: '2.أ المسار البرمجي', priority: 4, prereqs: ['sim'] },

        { id: 'num', title: 'طرق عددية وبرمجية', units: 4, cat: '2.أ المسار البرمجي', priority: 6, prereqs: ['c_lang'] },
        { id: 'web', title: 'تصميم مواقع الإنترنت', units: 3, cat: '2.أ المسار البرمجي', priority: 6, prereqs: ['num'] },
        { id: 'discrete', title: 'تراكيب منفصلة', units: 3, cat: '2.أ المسار البرمجي', priority: 5, prereqs: ['c_lang'] },

        { id: 'mobile', title: 'تطبيقات موبايل (اختياري)', units: 4, cat: '2.أ المسار البرمجي', priority: 4, prereqs: ['web', 'java'], isOptional: true },

        // 2.ب مسار تحليل النظم والبرمجيات
        { id: 'cs_intro', title: 'مقدمة في علم الحاسوب', units: 3, cat: '2.ب مسار تحليل النظم والبرمجيات', priority: 9, prereqs: [] },
        { id: 'sa', title: 'تحليل نظم', units: 4, cat: '2.ب مسار تحليل النظم والبرمجيات', priority: 8, prereqs: ['cs_intro'] },
        { id: 'se', title: 'هندسة البرمجيات', units: 4, cat: '2.ب مسار تحليل النظم والبرمجيات', priority: 7, prereqs: ['sa'] },
        { id: 'db', title: 'إدارة قواعد البيانات', units: 4, cat: '2.ب مسار تحليل النظم والبرمجيات', priority: 7, prereqs: ['sa'] },
        { id: 'os', title: 'نظم تشغيل', units: 4, cat: '2.ب مسار تحليل النظم والبرمجيات', priority: 6, prereqs: ['se'] },
        { id: 'delphi', title: 'لغة دلفي', units: 4, cat: '2.ب مسار تحليل النظم والبرمجيات', priority: 6, prereqs: ['db'] },
        { id: 'arch', title: 'معمارية الحاسوب', units: 4, cat: '2.ب مسار تحليل النظم والبرمجيات', priority: 5, prereqs: ['os', 'delphi'] },
        { id: 'sys_prog', title: 'برمجة نظم', units: 4, cat: '2.ب مسار تحليل النظم والبرمجيات', priority: 4, prereqs: ['arch'] },

        // 2.ج مسار العتاد والشبكات
        { id: 'ee', title: 'مبادئ هندسة كهربائية', units: 4, cat: '2.ج مسار العتاد والشبكات', priority: 8, prereqs: [] },
        { id: 'digital', title: 'مقدمة لأنظمة رقمية', units: 4, cat: '2.ج مسار العتاد والشبكات', priority: 7, prereqs: ['ee'] },
        { id: 'org', title: 'تنظيم حاسبات', units: 4, cat: '2.ج مسار العتاد والشبكات', priority: 6, prereqs: ['digital'] },
        { id: 'asm', title: 'لغة التجميع', units: 4, cat: '2.ج مسار العتاد والشبكات', priority: 5, prereqs: ['org'] },
        { id: 'net', title: 'شبكات الحاسوب', units: 4, cat: '2.ج مسار العتاد والشبكات', priority: 5, prereqs: ['asm'] },
        
        { id: 'sec', title: 'أمن المعلومات والبيانات (اختياري)', units: 4, cat: '2.ج مسار العتاد والشبكات', priority: 4, prereqs: ['net'], isOptional: true },
        { id: 'net_design', title: 'إعداد وتصميم وحماية الشبكات (اختياري)', units: 4, cat: '2.ج مسار العتاد والشبكات', priority: 4, prereqs: ['net'], isOptional: true },

        // 3. مرحلة التخرج
        { id: 'train', title: 'مناهج البحث والتدريب الميداني', units: 2, cat: '3. مرحلة التخرج', priority: 10, reqUnits: 115 },
        { id: 'proj', title: 'مشروع التخرج', units: 4, cat: '3. مرحلة التخرج', priority: 10, reqUnits: 115 }
    ];

    let passed = new Set();
    let studentType = 'regular';

    function selectInitialType(t) {
        setStudentType(t);
        document.getElementById('welcome-modal').style.display = 'none';
    }

    function setStudentType(t) {
        studentType = t;
        document.getElementById('btn-regular').classList.toggle('active', t === 'regular');
        document.getElementById('btn-transfer').classList.toggle('active', t === 'transfer');
        render();
    }

    function getPassedUnits() {
        let sum = 0;
        courses.forEach(c => { if (passed.has(c.id)) sum += c.units; });
        return sum;
    }

    function getPassedOptionalCount() {
        let count = 0;
        courses.filter(c => c.isOptional).forEach(c => {
            if (passed.has(c.id)) count++;
        });
        return count;
    }

    function render() {
        const container = document.getElementById('categories-container');
        container.innerHTML = '';
        const currentUnits = getPassedUnits();
        const optionalPassedCount = getPassedOptionalCount();
        const cats = [...new Set(courses.map(c => c.cat))];

        cats.forEach(cat => {
            const h = document.createElement('div');
            h.className = 'category-title';
            h.innerText = cat;
            container.appendChild(h);

            const grid = document.createElement('div');
            grid.className = 'courses-grid';

            courses.filter(c => c.cat === cat).forEach(c => {
                const isPassed = passed.has(c.id);
                let isLocked = false;

                if (studentType === 'regular') {
                    if (c.prereqs && c.prereqs.some(p => !passed.has(p))) isLocked = true;
                    if (c.reqUnits && currentUnits < c.reqUnits) isLocked = true;
                }

                if (c.isOptional && !isPassed && optionalPassedCount >= 2) {
                    isLocked = true;
                }

                const card = document.createElement('div');
                card.className = `course-card ${isPassed ? 'passed' : ''} ${isLocked ? 'locked' : ''}`;

                let dots = '<div class="units-dots">';
                for(let i=0; i<c.units; i++) dots += '<div class="dot"></div>';
                dots += '</div>';

                let prereqName = '';
                if (c.reqUnits) {
                    prereqName = `تتطلب ${c.reqUnits} وحدة`;
                } else if (c.isOptional && optionalPassedCount >= 2 && !isPassed) {
                    prereqName = 'تم إكمال المادتين الاختياريتين';
                } else if (c.prereqs && c.prereqs.length > 0) {
                    const titles = c.prereqs.map(pid => {
                        const p = courses.find(x => x.id === pid);
                        return p ? p.title.replace(' (اختياري)', '') : '';
                    }).join(' + ');
                    prereqName = `تفتح بعد: ${titles}`;
                }

                card.innerHTML = `
                    <span class="status-badge">${isPassed ? 'مصفاة ✓' : (isLocked ? '🔒' : 'متاحة')}</span>
                    ${dots}
                    <div class="title">${c.title}</div>
                    ${prereqName ? `<div class="prereq">${prereqName}</div>` : ''}
                `;

                if (!isLocked) card.onclick = () => toggle(c.id);
                grid.appendChild(card);
            });
            container.appendChild(grid);
        });

        document.getElementById('passed-count').innerText = passed.size;
        document.getElementById('passed-units').innerText = `${currentUnits} / ${TOTAL_UNITS}`;
        document.getElementById('grad-condition').innerText = `${currentUnits} / ${GRAD_REQ_UNITS}`;
        document.getElementById('progress-percent').innerText = `${Math.round((currentUnits/TOTAL_UNITS)*100)}%`;

        updateNext(currentUnits, optionalPassedCount);
    }

    function toggle(id) {
        if (passed.has(id)) {
            passed.delete(id);
            if (studentType === 'regular') {
                let check = true;
                while(check) {
                    check = false;
                    const u = getPassedUnits();
                    courses.forEach(c => {
                        if (passed.has(c.id)) {
                            if (c.prereqs && c.prereqs.some(p => !passed.has(p))) { passed.delete(c.id); check = true; }
                            if (c.reqUnits && u < c.reqUnits) { passed.delete(c.id); check = true; }
                        }
                    });
                }
            }
        } else {
            passed.add(id);
        }
        render();
    }

    function updateNext(u, optionalCount) {
        const list = document.getElementById('next-courses-list');
        list.innerHTML = '';

        // تصفية المواد المتاحة حالياً بناءً على وضع الطالب
        let avail = courses.filter(c => {
            if (passed.has(c.id)) return false;
            if (c.isOptional && optionalCount >= 2) return false;
            if (studentType === 'transfer') return true;
            if (c.reqUnits && u < c.reqUnits) return false;
            return !c.prereqs || c.prereqs.every(p => passed.has(p));
        });

        // ترتيب المواد المتاحة حسب الأولوية البرمجية والأكاديمية
        avail.sort((a, b) => b.priority - a.priority);

        let total = 0;
        let selectedInThisTerm = new Set();

        avail.forEach(c => {
            // للتأكد من عدم اقتراح مادتين متتاليتين في نفس الفصل الافتراضي
            let prereqAlreadyInTerm = c.prereqs && c.prereqs.some(p => selectedInThisTerm.has(p));
            
            if (!prereqAlreadyInTerm && (total + c.units <= 21)) {
                total += c.units;
                selectedInThisTerm.add(c.id);
                
                const item = document.createElement('div');
                item.className = 'next-item';
                item.innerHTML = `<span>${c.title}</span><span>${c.units} وحدات</span>`;
                list.appendChild(item);
            }
        });

        if (total === 0) list.innerHTML = '<div style="color:var(--text-muted); text-align:center;">لا يوجد مواد متاحة.</div>';
    }

    render();
</script>
</body>
</html>
